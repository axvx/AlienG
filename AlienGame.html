<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Marine vs Aliens - Tactical Bomb</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 800px;
            aspect-ratio: 8 / 5;
            border: 4px solid #131;
            box-shadow: 0 0 30px #0a0;
            background-color: #020502;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
        }
        .ui-center {
            color: #ffaa00;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #f00;
            display: none;
            text-shadow: 2px 2px 10px #f00;
            z-index: 10;
        }
        #instructions {
            margin-top: 15px;
            font-size: 16px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }
        .key {
            color: #fff;
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            gap: 15px;
            z-index: 20;
        }
        .mobile-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(0, 200, 0, 0.3);
            border: 2px solid #0f0;
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            touch-action: none;
        }
        .mobile-btn:active {
            background: rgba(0, 255, 0, 0.6);
        }
        .mobile-btn.bomb-btn {
            background: rgba(200, 0, 0, 0.3);
            border-color: #f00;
            color: #f00;
        }
        .mobile-btn.bomb-btn:active {
            background: rgba(255, 0, 0, 0.6);
        }
        @media (max-width: 850px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="mobile-controls">
            <div id="btn-bomb" class="mobile-btn bomb-btn">BOMB</div>
            <div id="btn-shoot" class="mobile-btn">FIRE</div>
        </div>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div class="ui-center">BOMBS: <span id="bombs">3</span></div>
            <div>RADAR: <span id="radar">CLEAR</span></div>
            <div style="color: #0ff;">AGENT: <span id="agent-status">OFF</span></div>
        </div>
        <div id="game-over">
            <div>YOU WERE ASSIMILATED</div>
            <div style="font-size: 18px; color: #fff; margin-top: 20px;">Press <span class="key">R</span> to Restart</div>
        </div>
    </div>

    <div id="instructions">
        <b>[PC]</b> Move: <span class="key">A</span>/<span class="key">D</span> &nbsp;|&nbsp; 
        Shoot: <span class="key">C</span> &nbsp;|&nbsp; 
        Bomb: <span class="key">X</span> &nbsp;|&nbsp; 
        Auto: <span class="key">T</span><br>
        <span style="margin-top: 5px; display: inline-block;"><b>[Mobile]</b> Move: <span>Swipe</span> &nbsp;|&nbsp; 
        Shoot: <span>FIRE Btn</span> &nbsp;|&nbsp; 
        Bomb: <span>BOMB Btn</span></span>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const radarEl = document.getElementById('radar');
const bombsEl = document.getElementById('bombs');
const gameOverScreen = document.getElementById('game-over');
const agentStatusEl = document.getElementById('agent-status');

// ---------------- SOUND ENGINE ---------------- //
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const Sound = {
    init() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
    },
    shoot() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    },
    kill() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    },
    warning() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    },
    explosion() {
        // Generates white noise and passes it through a decaying low-pass filter
        if (audioCtx.state === 'suspended') return;
        const bufferSize = audioCtx.sampleRate * 2; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; 
        }
        
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.5);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noiseSource.start();
    },
    gameOver() {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.5);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
    }
};

// ---------------- 3D ENGINE CONSTANTS ---------------- //
const FOCAL_LENGTH = 300; 
const VP_X = canvas.width / 2;
const VP_Y = canvas.height / 2 - 20;

const LEFT_WALL = -300;
const RIGHT_WALL = 300;
const FLOOR_Y = 100;
const CEIL_Y = -100;
const LANES = [-200, -100, 0, 100, 200]; 

// Game State
let isGameOver = false;
let score = 0;
let bombs = 3;
let aliens = [];
let particles = [];
let spawnTimer = 0;
let alienSpeed = 4;
let muzzleFlash = 0;
let screenFlash = 0;
let lastWarningTime = 0;
let fireCooldown = 0;
let isTouchShooting = false;

// Player (Marine) State
const player = { x: 0, z: 50, speed: 6 };

// Input Handling
const keys = {};
window.addEventListener('keydown', e => {
    Sound.init(); 
    keys[e.key.toLowerCase()] = true;
    
    if (e.key.toLowerCase() === 'c' && !isGameOver && fireCooldown <= 0) { shoot(); fireCooldown = 12; }
    if (e.key.toLowerCase() === 'x' && !isGameOver) deployBomb();
    if (e.key.toLowerCase() === 'r' && isGameOver) resetGame();
    if (e.key.toLowerCase() === 't') {
        agentEnabled = !agentEnabled;
        agentStatusEl.innerText = agentEnabled ? "ON" : "OFF";
    }
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

// Virtual Buttons
const btnShoot = document.getElementById('btn-shoot');
const btnBomb = document.getElementById('btn-bomb');

btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); isTouchShooting = true; Sound.init(); });
btnShoot.addEventListener('touchend', (e) => { e.preventDefault(); isTouchShooting = false; });
btnShoot.addEventListener('touchcancel', (e) => { e.preventDefault(); isTouchShooting = false; });

btnBomb.addEventListener('touchstart', (e) => { e.preventDefault(); Sound.init(); if (!isGameOver) deployBomb(); });

// Touch Handling for Movement
let movementTouchId = null;
let touchStartX = 0;
let lastPlayerX = 0;

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    Sound.init();
    if (isGameOver) { resetGame(); return; }
    
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (movementTouchId === null) {
            movementTouchId = t.identifier;
            touchStartX = t.clientX;
            lastPlayerX = player.x;
        }
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (isGameOver) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === movementTouchId) {
            let deltaX = t.clientX - touchStartX;
            player.x = lastPlayerX + deltaX * 1.5;
            player.x = Math.max(LEFT_WALL + 50, Math.min(RIGHT_WALL - 50, player.x));
        }
    }
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === movementTouchId) {
            movementTouchId = null;
        }
    }
}, {passive: false});
canvas.addEventListener('touchcancel', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === movementTouchId) movementTouchId = null;
    }
});

function project(x, y, z, camX) {
    const scale = FOCAL_LENGTH / z;
    return {
        x: VP_X + (x - camX) * scale,
        y: VP_Y + y * scale,
        scale: scale
    };
}

function createBloodExplosion(x, z) {
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: FLOOR_Y - 80 + (Math.random() - 0.5) * 40,
            z: z + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 1.2) * 15,
            vz: (Math.random() - 0.5) * 20,
            life: Math.random() * 20 + 20,
            maxLife: 40,
            size: Math.random() * 20 + 5
        });
    }
}

function spawnAlien() {
    const laneX = LANES[Math.floor(Math.random() * LANES.length)];
    aliens.push({ x: laneX, z: 2500, alive: true });
}

function shoot() {
    Sound.shoot(); 
    muzzleFlash = 5;
    
    let hitThreshold = 50; 
    let closestTarget = null;
    let minZ = 9999;

    for (let alien of aliens) {
        if (alien.alive && Math.abs(alien.x - player.x) < hitThreshold) {
            if (alien.z < minZ) {
                minZ = alien.z;
                closestTarget = alien;
            }
        }
    }

    if (closestTarget) {
        closestTarget.alive = false;
        createBloodExplosion(closestTarget.x, closestTarget.z);
        Sound.kill(); 
        score += 100;
        scoreEl.innerText = score;
        alienSpeed += 0.1; 
    }
}

function deployBomb() {
    if (bombs > 0) {
        bombs--;
        bombsEl.innerText = bombs;
        Sound.explosion();
        screenFlash = 30; // 30 frames of bright flash
        
        let kills = 0;
        aliens.forEach(alien => {
            if (alien.alive) {
                alien.alive = false;
                createBloodExplosion(alien.x, alien.z);
                kills++;
            }
        });

        if (kills > 0) {
            score += kills * 100;
            scoreEl.innerText = score;
        }
    }
}

function resetGame() {
    isGameOver = false;
    score = 0;
    bombs = 3;
    aliens = [];
    particles = [];
    player.x = 0;
    alienSpeed = 4;
    scoreEl.innerText = score;
    bombsEl.innerText = bombs;
    gameOverScreen.style.display = 'none';
}

function update() {
    if (isGameOver) return;

    if (fireCooldown > 0) fireCooldown--;
    if (isTouchShooting && fireCooldown <= 0) {
        shoot();
        fireCooldown = 12;
    }

    if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
    if (keys['d'] || keys['arrowright']) player.x += player.speed;
    
    player.x = Math.max(LEFT_WALL + 50, Math.min(RIGHT_WALL - 50, player.x));

    spawnTimer++;
    if (spawnTimer > Math.max(30, 90 - score/200)) {
        spawnAlien();
        spawnTimer = 0;
    }

    let closestDistance = 9999;
    for (let i = aliens.length - 1; i >= 0; i--) {
        let alien = aliens[i];
        
        if (!alien.alive) {
            aliens.splice(i, 1);
            continue;
        }

        alien.z -= alienSpeed; 
        if (alien.z < closestDistance) closestDistance = alien.z;

        if (alien.z <= player.z + 10) {
            isGameOver = true;
            Sound.gameOver(); 
            gameOverScreen.style.display = 'flex';
        }
    }

    // Radar Warning Beep
    if (closestDistance < 500) {
        lastWarningTime++;
        if (lastWarningTime > 30) {
            Sound.warning();
            lastWarningTime = 0;
        }
        radarEl.innerText = "WARNING - CLOSE!";
        radarEl.style.color = "#f00";
    } else {
        lastWarningTime = 0;
        radarEl.innerText = aliens.length > 0 ? (closestDistance/10).toFixed(0) + "m" : "CLEAR";
        radarEl.style.color = "#0f0";
    }

    if (muzzleFlash > 0) muzzleFlash--;
    if (screenFlash > 0) screenFlash--;

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.vy += 1.2; // Gravity
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// ---------------- RENDER ENGINE ---------------- //

function drawGrid() {
    ctx.strokeStyle = 'rgba(0, 200, 0, 0.3)';
    ctx.lineWidth = 1.5;

    let timeOffset = (Date.now() / 15) % 100;

    for (let i = 0; i < 30; i++) {
        let z = timeOffset + i * 100;
        if (z < 50) continue; 

        let pBL = project(LEFT_WALL, FLOOR_Y, z, player.x);
        let pBR = project(RIGHT_WALL, FLOOR_Y, z, player.x);
        let pTL = project(LEFT_WALL, CEIL_Y, z, player.x);
        let pTR = project(RIGHT_WALL, CEIL_Y, z, player.x);

        ctx.beginPath(); ctx.moveTo(pBL.x, pBL.y); ctx.lineTo(pBR.x, pBR.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pTL.x, pTL.y); ctx.lineTo(pTR.x, pTR.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pBL.x, pBL.y); ctx.lineTo(pTL.x, pTL.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pBR.x, pBR.y); ctx.lineTo(pTR.x, pTR.y); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(0, 255, 0, 0.6)';
    for (let laneX of LANES) {
        let pNear = project(laneX, FLOOR_Y, 50, player.x);
        let pFar = project(laneX, FLOOR_Y, 3000, player.x);
        ctx.beginPath(); ctx.moveTo(pNear.x, pNear.y); ctx.lineTo(pFar.x, pFar.y); ctx.stroke();
    }

    let wBL_near = project(LEFT_WALL, FLOOR_Y, 50, player.x);
    let wBL_far = project(LEFT_WALL, FLOOR_Y, 3000, player.x);
    let wBR_near = project(RIGHT_WALL, FLOOR_Y, 50, player.x);
    let wBR_far = project(RIGHT_WALL, FLOOR_Y, 3000, player.x);
    
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(wBL_near.x, wBL_near.y); ctx.lineTo(wBL_far.x, wBL_far.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wBR_near.x, wBR_near.y); ctx.lineTo(wBR_far.x, wBR_far.y); ctx.stroke();
}

function drawAliens() {
    let sortedAliens = [...aliens].sort((a, b) => b.z - a.z);

    sortedAliens.forEach(alien => {
        let p = project(alien.x, FLOOR_Y, alien.z, player.x);
        let w = 80 * p.scale;
        let h = 130 * p.scale;
        
        ctx.fillStyle = '#080808';
        ctx.beginPath(); ctx.ellipse(p.x, p.y - h/2, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#112211';
        ctx.beginPath(); ctx.ellipse(p.x, p.y - h*0.8, w*0.4, h*0.3, Math.PI/6, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#f00';
        ctx.fillRect(p.x - w*0.2, p.y - h*0.85, w*0.1, h*0.05);
        ctx.fillRect(p.x + w*0.1, p.y - h*0.85, w*0.1, h*0.05);

        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2 * p.scale;
        ctx.beginPath(); ctx.arc(p.x, p.y - h*0.4, w*0.2, 0, Math.PI); ctx.stroke();
    });
}

function drawHUD() {
    let isTargetLocked = false;
    for (let alien of aliens) {
        if (Math.abs(alien.x - player.x) < 50) isTargetLocked = true;
    }

    ctx.strokeStyle = isTargetLocked ? '#f00' : '#0f0';
    ctx.lineWidth = 2;
    let cx = canvas.width / 2;
    let cy = VP_Y + 15; 
    
    ctx.beginPath();
    ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
    ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
    ctx.stroke();

    if (isTargetLocked) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
        ctx.fillRect(cx - 30, cy - 30, 60, 60);
    }

    if (muzzleFlash > 0) {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = muzzleFlash * 2;
        ctx.beginPath(); ctx.moveTo(cx, canvas.height); ctx.lineTo(cx, cy); ctx.stroke();
        
        ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(cx - 30, canvas.height - 100, 60, 100); 
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(cx - 50, canvas.height - 40, 100, 40); 
    ctx.fillStyle = '#0f0';    ctx.fillRect(cx - 15, canvas.height - 80, 30, 10);
    ctx.fillStyle = muzzleFlash > 0 ? '#fff' : '#0ff';
    ctx.fillRect(cx - 10, canvas.height - 100, 20, 20); 

    // Bomb Flashbang overlay
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash / 30})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function drawParticles() {
    particles.forEach(p => {
        let proj = project(p.x, p.y, p.z, player.x);
        if (proj.scale > 0 && proj.scale < 20) {
            ctx.fillStyle = `rgba(220, 0, 0, ${p.life / p.maxLife})`;
            let size = p.size * proj.scale;
            ctx.fillRect(proj.x - size/2, proj.y - size/2, size, size);
        }
    });
}

function render() {
    ctx.fillStyle = '#020502';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawGrid();
    drawAliens();
    drawParticles();
    drawHUD();
}

let agentEnabled = false;

function agentUpdate() {
    if (!agentEnabled) return;
    
    if (isGameOver) {
        if (Math.random() < 0.02) resetGame(); // Small delay before auto-restart
        return;
    }

    let closestAlien = null;
    let minZ = 9999;

    for (let alien of aliens) {
        if (alien.alive && alien.z < minZ) {
            minZ = alien.z;
            closestAlien = alien;
        }
    }

    keys['a'] = false;
    keys['d'] = false;
    keys['arrowleft'] = false;
    keys['arrowright'] = false;

    if (closestAlien) {
        let diffX = closestAlien.x - player.x;
        
        if (diffX > 10) {
            keys['d'] = true;
        } else if (diffX < -10) {
            keys['a'] = true;
        }

        if (Math.abs(diffX) < 50 && closestAlien.z < 2500) {
            if (Math.random() < 0.2) shoot();
        }
        
        if (closestAlien.z < 200 && Math.abs(diffX) >= 50 && bombs > 0) {
            deployBomb();
        }
    }
}

function loop() {
    agentUpdate();
    update();
    render();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
